name: Windows build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .NET 10 installieren
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Windows-Paket erstellen und Version prüfen
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
        run: ./.github/scripts/Build-Windows.ps1 -RuntimeIdentifier $env:RUNTIME_IDENTIFIER -ReleaseTag $env:RELEASE_TAG
      - name: Anwendungsstart aus dem ZIP-Paket prüfen
        shell: powershell
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $archive = @(Get-ChildItem "artifacts/packages/*-$env:RUNTIME_IDENTIFIER.zip")
          if ($archive.Count -ne 1) { throw 'Genau ein ZIP-Paket wird erwartet.' }
          $testPath = Join-Path $env:RUNNER_TEMP "smoke-$env:RUNTIME_IDENTIFIER"
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $testPath
          foreach ($fileName in @('SVN_Notifier.exe', 'LICENSE', 'README.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $testPath $fileName))) {
              throw "Datei fehlt im ZIP-Paket: $fileName"
            }
          }
          # Eine portable Testkonfiguration verhindert Zugriffe auf vorhandene Benutzer-Repositories.
          @('[Settings]', 'Version=1.9', 'Language=0', 'SVN_path=missing-svn.exe', 'TortoiseSVN_path=missing-tortoise.exe') |
            Set-Content -LiteralPath (Join-Path $testPath 'SVN_Notifier.ini') -Encoding ascii
          $process = Start-Process -FilePath (Join-Path $testPath 'SVN_Notifier.exe') -WorkingDirectory $testPath -PassThru
          try {
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Die Anwendung wurde beendet: Exit-Code $($process.ExitCode)" }
              $windows = [System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $condition)
              $settingsWindow = $windows | Where-Object { $_.Current.Name -ceq 'Settings' -and -not $_.Current.IsOffscreen } | Select-Object -First 1
            } while ($null -eq $settingsWindow -and [DateTime]::UtcNow -lt $deadline)
            if ($null -eq $settingsWindow) {
              throw 'Die Anwendung hat den Einstellungsdialog nicht geöffnet.'
            }
            $windowPattern = $settingsWindow.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
            if (-not $windowPattern.WaitForInputIdle(5000)) {
              throw 'Der Einstellungsdialog reagiert nicht.'
            }
            Write-Host "Anwendungsstart erfolgreich: $env:RUNTIME_IDENTIFIER"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Programmupdater und EXE-Austausch prüfen
        shell: powershell
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
        run: ./.github/scripts/Test-ApplicationUpdater.ps1 -RuntimeIdentifier $env:RUNTIME_IDENTIFIER
      - name: Pakete und Prüfsummen hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.runtime }}
          path: artifacts/packages/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release veröffentlichen
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Release-Hinweise auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows-Pakete herunterladen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          path: release
          merge-multiple: true
      - name: Prüfsummen prüfen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          version="${RELEASE_TAG#v}"
          packages=("SVNNotifier-$version-win-x64.zip" "SVNNotifier-$version-win-x86.zip")
          for package in "${packages[@]}"; do
            test -s "$package"
            test -s "$package.sha256"
          done
          cat "${packages[0]}.sha256" "${packages[1]}.sha256" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${packages[@]}" SHA256SUMS.txt \
            --verify-tag --draft --title "SVN Notifier $version" \
            --notes-file ../.github/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
