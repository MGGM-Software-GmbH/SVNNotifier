name: Windows build

on:
  push:
    branches: [master, feature/winui-native-notifications]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .NET 10 installieren
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Windows-Testumgebung vor dem Paketbau prüfen
        shell: powershell
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
        run: |
          $testLog = "artifacts/ci-environment-$env:RUNTIME_IDENTIFIER.log"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          try {
            ./.github/scripts/Invoke-IsolatedDesktop.ps1 -ScriptPath .github/scripts/Test-WindowsTestEnvironment.ps1 -StandardUser -ProbeNativeProcess -LogPath $testLog -TimeoutSeconds 60
          } finally {
            if (Test-Path -LiteralPath $testLog) { Get-Content -LiteralPath $testLog | Write-Host }
          }
      - name: Windows-Paket erstellen und Version prüfen
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
        run: ./.github/scripts/Build-Windows.ps1 -RuntimeIdentifier $env:RUNTIME_IDENTIFIER -ReleaseTag $env:RELEASE_TAG
      - name: Windows-Produkt mit normalen Benutzerrechten prüfen
        shell: powershell
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.runtime }}
        run: |
          $testLog = "artifacts/ci-validation-$env:RUNTIME_IDENTIFIER.log"
          try {
            ./.github/scripts/Invoke-IsolatedDesktop.ps1 -ScriptPath .github/scripts/Test-WindowsProduct.ps1 -StandardUser -LogPath $testLog -TimeoutSeconds 1800
          } finally {
            if (Test-Path -LiteralPath $testLog) { Get-Content -LiteralPath $testLog | Write-Host }
          }
      - name: Prüflog erhalten
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.runtime }}
          path: artifacts/ci-*.log
          if-no-files-found: warn
      - name: Pakete und Prüfsummen hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.runtime }}
          path: artifacts/packages/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release veröffentlichen
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Release-Hinweise auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release-Commit im Hauptbranch prüfen
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
      - name: Windows-Pakete herunterladen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          path: release
          merge-multiple: true
      - name: Prüfsummen prüfen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          version="${RELEASE_TAG#v}"
          packages=("SVNNotifier-$version-win-x64.zip" "SVNNotifier-$version-win-x86.zip")
          for package in "${packages[@]}"; do
            test -s "$package"
            test -s "$package.sha256"
          done
          cat "${packages[0]}.sha256" "${packages[1]}.sha256" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${packages[@]}" SHA256SUMS.txt \
            --verify-tag --draft --title "SVN Notifier $version" \
            --notes-file ../.github/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
